name: qa-agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: qa-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Skip the slow device job for PRs that cannot change the app (docs, CI for other jobs, ...).
    # A skipped job counts as passing, so this is safe to require.
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE_REF" HEAD | grep -E '^(src/|app/|vendors/|app\.config\.ts$|metro\.config\.js$|jest\.config\.js$|babel\.config\.js$|index\.ts$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.npmrc$|\.nvmrc$|tsconfig\.json$|scripts/agent-qa/|\.github/workflows/qa-agent\.yml$)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "No files that can change the app (src, assets, app and package config, the agent itself); skipping the device job."
          fi

  qa-agent:
    needs: changes
    # Only same-repository PRs get the Claude token; forks never do.
    if: ${{ needs.changes.outputs.app == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: qa-agent
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REFERENCE_VENDOR: ${{ vars.REFERENCE_VENDOR }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Choose the reference vendor
        # Every vendor builds through the same code; CI builds one of them (repository variable REFERENCE_VENDOR).
        run: |
          VENDOR="${REFERENCE_VENDOR:-default}"
          echo "APP_VARIANT=$VENDOR" >> "$GITHUB_ENV"
          echo "APP_ID=$(node -p "require('./vendors/$VENDOR/vendor.json').identity.androidPackage")" >> "$GITHUB_ENV"
      - name: Generate the Android project
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Build the release APK
        working-directory: android
        # The emulator is x86_64, so skip compiling the other CPU architectures.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the QA tools
        run: |
          # pnpm 11 puts global binaries in $PNPM_HOME/bin, and refuses to install unless that is on the path.
          export PNPM_HOME="$HOME/.local/share/pnpm"
          mkdir -p "$PNPM_HOME/bin"
          export PATH="$PNPM_HOME/bin:$PATH"
          echo "$PNPM_HOME/bin" >> "$GITHUB_PATH"
          # pnpm blocks install scripts by default; both tools need theirs to fetch a native binary.
          pnpm add -g --allow-build=agent-device --allow-build=@anthropic-ai/claude-code agent-device@0.21.16 @anthropic-ai/claude-code@2.1.285
      - name: Prepare the agent input
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          {
            echo "<pull-request-title>"
            echo "$PR_TITLE"
            echo "</pull-request-title>"
            echo "<diff>"
            git diff "origin/$BASE_REF" HEAD -- . ':(exclude)package-lock.json' | head -c 60000
            echo "</diff>"
          } > qa-input.txt
      - name: Run the QA agent on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # The token is only visible to this step, never to the build steps above.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            mkdir -p qa-artifacts
            scripts/agent-qa/run-agent.sh
      - name: Upload screenshots and agent output
        id: upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-agent
          path: |
            qa-artifacts
            qa-claude-output.json
            qa-claude-error.log
          if-no-files-found: warn
          retention-days: 7
      - name: Write the report
        if: ${{ !cancelled() }}
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          HAS_ACK=false
          if gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' | grep -qx qa-acknowledged; then
            HAS_ACK=true
          fi
          export HAS_ACK
          node scripts/agent-qa/report.mjs
      - name: Comment on the pull request
        if: ${{ !cancelled() }}
        run: gh pr comment "$PR_NUMBER" --body-file qa-comment.md --edit-last --create-if-none
      - name: Fail the check unless the QA agent passed
        if: ${{ !cancelled() }}
        run: test "$(cat qa-status.txt)" = pass
