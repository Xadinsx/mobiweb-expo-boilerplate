name: maestro-android

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: maestro-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Skip the slow device job for PRs that cannot change the app (docs, CI for other jobs, ...).
    # A skipped job counts as passing, so this is safe to require.
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE_REF" HEAD | grep -E '^(src/|app/|vendors/|\.maestro/|app\.config\.ts$|metro\.config\.js$|jest\.config\.js$|babel\.config\.js$|index\.ts$|package(-lock)?\.json$|tsconfig\.json$|\.github/workflows/maestro-android\.yml$)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "No files that can change the app (src, assets, app and package config, Maestro flows); skipping the device job."
          fi

  maestro-android:
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAESTRO_VERSION: 2.10.0
      REFERENCE_VENDOR: ${{ vars.REFERENCE_VENDOR }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Choose the reference vendor
        # Every vendor builds through the same code; CI builds one of them (repository variable REFERENCE_VENDOR).
        run: |
          VENDOR="${REFERENCE_VENDOR:-default}"
          echo "APP_VARIANT=$VENDOR" >> "$GITHUB_ENV"
          echo "APP_ID=$(node -p "require('./vendors/$VENDOR/vendor.json').identity.androidPackage")" >> "$GITHUB_ENV"
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build the release APK
        working-directory: android
        # The emulator is x86_64, so skip compiling the other CPU architectures.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run the Maestro flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            scripts/ci/run-maestro.sh
      - name: Upload the Maestro report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android
          path: |
            maestro-report.xml
            ~/.maestro/tests
          if-no-files-found: warn
          retention-days: 7
