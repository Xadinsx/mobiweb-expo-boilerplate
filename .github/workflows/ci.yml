name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run dead-code

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --verbose .

  ticket-key:
    runs-on: ubuntu-latest
    steps:
      - name: Require a Jira ticket key in the branch name and PR title
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^[A-Z][A-Z0-9]+-[0-9]+'
          if ! [[ "$BRANCH" =~ $pattern ]]; then
            echo "Branch name must start with a Jira ticket key, for example MOB-123-short-name. Got: $BRANCH"
            exit 1
          fi
          if ! [[ "$TITLE" =~ $pattern ]]; then
            echo "PR title must start with a Jira ticket key, for example MOB-123 short summary. Got: $TITLE"
            exit 1
          fi
