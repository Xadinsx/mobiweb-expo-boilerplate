name: Build the Android release APK
description: >
  Installs the toolchain, restores the native build caches, and builds the release APK of the
  reference vendor (the repository variable REFERENCE_VENDOR, or "default"). Used by the
  maestro-android and qa-agent jobs and by the native-cache job that seeds the caches on main.
inputs:
  reference-vendor:
    description: The vendor folder to build; empty means "default".
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - uses: gradle/actions/setup-gradle@v4
    - run: pnpm install --frozen-lockfile
      shell: bash
    - name: Choose the reference vendor
      # Every vendor builds through the same code; CI builds one of them.
      shell: bash
      env:
        REFERENCE_VENDOR: ${{ inputs.reference-vendor }}
      run: |
        VENDOR="${REFERENCE_VENDOR:-default}"
        echo "APP_VARIANT=$VENDOR" >> "$GITHUB_ENV"
        echo "APP_ID=$(node -p "require('./vendors/$VENDOR/vendor.json').identity.androidPackage")" >> "$GITHUB_ENV"
    - name: Set up ccache for the C++ build
      # Gradle cannot cache React Native's C++ compilation, so ccache wraps the compiler through CMake.
      # compiler_check=content is needed on CI, where file timestamps change on every checkout.
      shell: bash
      run: |
        sudo apt-get install -y --no-install-recommends ccache
        {
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          echo "CCACHE_COMPILERCHECK=content"
          echo "CCACHE_DIR=$HOME/.cache/ccache"
          echo "CCACHE_MAXSIZE=2G"
        } >> "$GITHUB_ENV"
    - uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        # A new entry per run, restored from the nearest earlier one (the seeding job on main writes them too).
        key: ccache-android-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
        restore-keys: |
          ccache-android-${{ hashFiles('pnpm-lock.yaml') }}-
          ccache-android-
    - name: Generate the Android project
      shell: bash
      run: pnpm exec expo prebuild --platform android --no-install
    - name: Build the release APK
      shell: bash
      working-directory: android
      # The emulator is x86_64, so skip compiling the other CPU architectures.
      run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
    - name: Show the ccache hit rate
      if: always()
      shell: bash
      run: ccache -s || true
