name: maestro-pr

on:
  pull_request:
    branches: ['*']

jobs:
  fingerprint:
    type: fingerprint

  get_android_build:
    needs: [fingerprint]
    type: get-build
    params:
      platform: android
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      wait_for_in_progress: true

  build_android:
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: e2e-test

  maestro_android:
    needs: [get_android_build, build_android]
    after: [get_android_build, build_android]
    type: maestro
    params:
      build_id: ${{ needs.get_android_build.outputs.build_id || needs.build_android.outputs.build_id }}
      flow_path: .maestro/flows

  get_ios_build:
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  build_ios:
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: e2e-test

  maestro_ios:
    needs: [get_ios_build, build_ios]
    after: [get_ios_build, build_ios]
    type: maestro
    params:
      build_id: ${{ needs.get_ios_build.outputs.build_id || needs.build_ios.outputs.build_id }}
      flow_path: .maestro/flows
