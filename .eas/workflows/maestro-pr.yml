name: maestro-pr

on:
  pull_request:
    branches: ['*']

jobs:
  fingerprint:
    type: fingerprint

  get_android_build:
    needs: [fingerprint]
    type: get-build
    params:
      platform: android
      profile: e2e-test
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      wait_for_in_progress: true

  # A matching native build may hold an older JS bundle, so embed this PR's bundle.
  repack_android:
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: repack
    params:
      build_id: ${{ needs.get_android_build.outputs.build_id }}

  build_android:
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: e2e-test

  # One of the two Maestro jobs runs per platform. A job whose needed job was skipped
  # is skipped too, so each one depends only on the job that produces its build.
  maestro_android_reused_build:
    needs: [repack_android]
    type: maestro
    params:
      build_id: ${{ needs.repack_android.outputs.build_id }}
      flow_path: .maestro/flows

  maestro_android_fresh_build:
    needs: [build_android]
    type: maestro
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      flow_path: .maestro/flows

  get_ios_build:
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: e2e-test
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  repack_ios:
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: repack
    params:
      build_id: ${{ needs.get_ios_build.outputs.build_id }}

  build_ios:
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: e2e-test

  # One of the two Maestro jobs runs per platform. A job whose needed job was skipped
  # is skipped too, so each one depends only on the job that produces its build.
  maestro_ios_reused_build:
    needs: [repack_ios]
    type: maestro
    params:
      build_id: ${{ needs.repack_ios.outputs.build_id }}
      flow_path: .maestro/flows

  maestro_ios_fresh_build:
    needs: [build_ios]
    type: maestro
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      flow_path: .maestro/flows
